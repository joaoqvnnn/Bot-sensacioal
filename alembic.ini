# ============================================
# LARIZINHA STORE - ALEMBIC CONFIG
# ============================================

[alembic]
# Diretório onde ficam as migrations
script_location = migrations

# Prefixo para nomes de arquivos de migration
file_template = %%(rev)s_%%(slug)s

# Timezone para as migrations
timezone = America/Sao_Paulo

# SQLAlchemy URL (será sobrescrita no env.py, mas mantenha aqui para referência)
# Em produção, use variáveis de ambiente
sqlalchemy.url = postgresql+asyncpg://larizinha:change_me_strong_password@postgres:5432/larizinha

# Desativa o modo echo por padrão
sqlalchemy.echo = False

# Configuração de logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
