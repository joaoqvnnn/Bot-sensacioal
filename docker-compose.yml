services:
  postgres:
    image: postgres:16-alpine
    container_name: larizinha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - larizinha_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Porta exposta apenas para debug local
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: larizinha_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - larizinha_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Porta exposta apenas para debug local
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larizinha_bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - larizinha_net
    volumes:
      - ./logs:/app/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larizinha_worker
    restart: unless-stopped
    command: ["python", "-m", "bot.workers"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - larizinha_net
    volumes:
      - ./logs:/app/logs

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larizinha_webapp
    restart: unless-stopped
    command: ["uvicorn", "webapp.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - larizinha_net
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    name: larizinha_postgres_data
  redis_data:
    name: larizinha_redis_data

networks:
  larizinha_net:
    name: larizinha_net
    driver: bridge
