version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: larizinha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - larizinha_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Porta exposta apenas se explicitamente habilitada para debug local.
    # Em produção, mantenha comentado ou use somente com firewall/VPN.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: larizinha_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - larizinha_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Porta exposta apenas se explicitamente habilitada para debug local.
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larizinha_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - larizinha_net
    volumes:
      - ./logs:/app/logs
    # O bot não publica portas, consome a API do Telegram via polling.
    # Webhooks futuros serão tratados por proxy reverso.

volumes:
  postgres_data:
    name: larizinha_postgres_data
  redis_data:
    name: larizinha_redis_data

networks:
  larizinha_net:
    name: larizinha_net
    driver: bridge
